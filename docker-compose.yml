# =============================================================================
# StructuraMind - Docker Compose
# =============================================================================
# Spin up the vector database (Qdrant) and the StructuraMind backend.
#
#   docker compose up -d
#
# Services:
#   qdrant    - Vector database for hybrid keyword + vector search
#   structuramind-backend - FastAPI backend (built from Dockerfile)
# =============================================================================

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: structuramind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  structuramind-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: structuramind_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  structuramind-frontend:
    image: python:3.11-slim
    container_name: structuramind_frontend
    working_dir: /app
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: >
      sh -c "pip install streamlit streamlit-option-menu requests python-dotenv
             && streamlit run frontend/app.py --server.port 8501
             --server.address 0.0.0.0"
    depends_on:
      - structuramind-backend
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  qdrant_storage:
